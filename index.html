<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0d0614;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 500px;

            background: #160b21;
            border: 1px solid #5d1b8c;
            border-radius: 20px;

            padding: 35px;
            text-align: center;

            box-shadow: 0 0 40px rgba(130, 40, 200, 0.25);
        }

        .avatar {
            width: 120px;
            height: 120px;

            border-radius: 50%;
            object-fit: cover;

            border: 3px solid #8b2dcc;

            box-shadow: 0 0 25px rgba(139, 45, 204, 0.6);

            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            color: #bda8c9;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            display: block;

            padding: 13px;

            border-radius: 10px;

            background: #241032;
            border: 1px solid #67219a;

            color: white;
            text-decoration: none;

            transition: 0.2s;
        }

        .button:hover {
            background: #6f20a5;
            transform: translateY(-2px);

            box-shadow: 0 0 20px rgba(139, 45, 204, 0.4);
        }

        footer {
            margin-top: 25px;
            color: #70577d;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Аватарка -->
        <img
            class="avatar"
            src="avatar.png"
            alt="Avatar"
        >

        <!-- Ник -->
        <h1>@YourNickname</h1>

        <!-- Описание -->
        <p class="description">
            Привет! Это моя личная страница.
        </p>

        <!-- Кнопки -->
        <div class="buttons">

            <a class="button" href="https://github.com/" target="_blank">
                GitHub
            </a>

            <a class="button" href="#">
                Telegram
            </a>

            <a class="button" href="#">
                Discord
            </a>

        </div>

        <footer>
            © 2026 YourNickname
        </footer>

    </div>

</body>
</html>
